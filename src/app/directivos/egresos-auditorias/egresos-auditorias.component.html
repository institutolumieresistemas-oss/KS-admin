<div class="card shadow-sm border-0 border-top border-danger border-4">
    <div class="card-header bg-white py-3">
        <div class="d-flex align-items-center justify-content-between">
            <h5 class="mb-0 text-danger"><i class="bi bi-arrow-down-circle me-2"></i>Auditoría de Egresos</h5>
            <span class="badge bg-danger" *ngIf="datos">{{ datos.length }} Egresos</span>
        </div>
    </div>

    <div class="card-body">
        <div class="row mb-4" *ngIf="seleccion">
            <div class="col-12">
                <div class="p-3 bg-light rounded d-flex justify-content-between align-items-center border-start border-danger border-4 shadow-sm">
                    <div>
                        <span class="text-muted small d-block">Egreso seleccionado:</span>
                        <strong class="text-dark">{{ seleccion.folio }} | {{ seleccion.beneficiario }}</strong>
                        <span class="ms-2 badge bg-outline-danger border border-danger text-danger">{{ seleccion.forma }}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-danger" [disabled]="seleccion.forma === 'Efectivo'" (click)="abrirVisor()">
              <i class="bi bi-zoom-in me-1"></i> Revisar Comprobante
            </button>
                        <button class="btn btn-success text-white" (click)="auditar();">Auditar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <app-tabla [configuracion]="configuracion" [datos]="datos" (emitidor)="seleccion = $event"></app-tabla>
            </div>
        </div>
    </div>
</div>

<app-modal [ngSwitch]="vista">
    <div *ngSwitchCase="'voucher'" class="p-0">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom bg-dark text-white">
            <h6 class="m-0">Auditoría de Voucher - Folio: {{ seleccion.folio }}</h6>
            <div class="d-flex align-items-center gap-3">
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-light" (click)="zoomOut()"><i class="bi bi-dash-lg"></i></button>
                    <button class="btn btn-light" (click)="resetZoom()">{{ (scale * 100).toFixed(0) }}%</button>
                    <button class="btn btn-light" (click)="zoomIn()"><i class="bi bi-plus-lg"></i></button>
                </div>
                <button class="btn-close btn-close-white" (click)="cerrarModal()"></button>
            </div>
        </div>

        <div class="visor-frame bg-secondary bg-opacity-25" (mousedown)="onMouseDown($event)" (mousemove)="onMouseMove($event)" (mouseup)="onMouseUp()" (mouseleave)="onMouseUp()" (wheel)="onWheel($event)">

            <div *ngIf="seleccion.imagen" class="wrapper-imagen" [style.transform]="'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')'" [class.grabbing]="isDragging">
                <img [src]="seleccion.imagen" class="img-fluid shadow-lg rounded" alt="Voucher egreso" draggable="false">
            </div>

            <div *ngIf="!seleccion.imagen" class="text-center p-5">
                <i class="bi bi-file-earmark-x fs-1 text-muted"></i>
                <p class="text-muted mt-2">Este egreso no cuenta con un voucher digitalizado.</p>
            </div>
        </div>

        <div class="p-2 bg-light border-top text-center">
            <small class="text-muted font-monospace">Scroll para zoom | Click y arrastra para mover</small>
        </div>
    </div>
</app-modal>
