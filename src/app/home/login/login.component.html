<div class="container-fluid">
    <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                <div class="d-flex align-items-center justify-content-between mb-3 text-center">
                    <app-logo></app-logo>
                </div>
                <app-input [etiqueta]="'Usuario'" (emitidor)="body.usuario = $event;"></app-input>
                <app-input [tipo]="'password'" [etiqueta]="'Contraseña'" (emitidor)="body.password = $event;"></app-input>
                <button type="submit" class="btn btn-primary py-3 w-100 mb-4" (click)="getToken()">Iniciar Sesion</button>
            </div>
        </div>
    </div>
</div>
