<div class="modal-header bg-info">
    <h4 class="text-white">Asignar actor a {{ personajeEvento.personaje?.nombre }}</h4>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
</div>
<div class="modal-body">
    <div class="container">
        <div class="row">
            <div class="col-sm-12">

                <div *ngIf="personajeEvento.actores_disponibles?.length === 0">
                    <p>No hay actores disponibles</p>
                </div>

                <div *ngIf="personajeEvento.actores_disponibles?.length > 0">
                    <app-select [etiqueta]="'Actores'" [datos]="personajeEvento.actores_disponibles" [dato]="personajeEvento.idActor" (emitidor)="personajeEvento.idActor = $event;"></app-select>
                </div>
            </div>
        </div><br>
        <div class="row justify-content-end">
            <div class="col-sm-12 d-md-flex justify-content-md-end">
                <button class="btn btn-danger" (click)="cerrar()">Cancelar</button>
                <button class="btn btn-success" (click)="emitir()">Guardar</button>
            </div>
        </div>
    </div>
</div>
