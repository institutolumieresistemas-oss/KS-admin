<div class="form-floating mb-3">
    <input type="{{ tipo }}" id="{{ id }}" class="form-control {{(mayusculas) ? 'mayusculas' : ''}}" placeholder="{{ place }}" [maxlength]="(cantidad > 0) ? cantidad : 15000000" [disabled]="activo" [(ngModel)]="valor" (keyup)="emitir()" (change)="emitir()"
        (keypress)="validar($event)" (blur)="blur()" [min]="(min !== '') ? min : ''" [max]="(max !== '') ? max : ''" />
    <label for={{id}}>{{etiqueta}}</label>
</div>
