<div class="bg-light text-center rounded p-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h6 class="mb-0">Configuracion de inicio</h6>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-sm-6">
                <div class="bg-white rounded h-100 p-4">
                    <div class="row">
                        <div class="col-sm-12 text-end">
                            <i class="fas fa-plus text-success" (click)="seleccion = 1; listado = eventos; modal();"></i>
                        </div>
                    </div>
                    <h6 class="mb-4">Eventos</h6>
                    <div class="row" *ngFor="let dato of eventos">
                        <div class="col-sm-12">
                            {{dato.nombre}}<i class="fa fa-times text-danger" (click)="quitar(dato);"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="bg-white rounded h-100 p-4">
                    <div class="row">
                        <div class="col-sm-12 text-end">
                            <i class="fas fa-plus text-success" (click)="seleccion = 2; listado = metas; modal();"></i>
                        </div>
                    </div>
                    <h6 class="mb-4">Metas</h6>
                    <div class="row" *ngFor="let dato of metas">
                        <div class="col-sm-12">
                            {{dato.nombre}}<i class="fa fa-times text-danger" (click)="quitar(dato);"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-modal [ngSwitch]="vista">
    <app-modal-configuracion-inicio *ngSwitchCase="'q'" [lista]="tipos" [listado]="listado" (emitidor)="agregar($event);"></app-modal-configuracion-inicio>
</app-modal>
