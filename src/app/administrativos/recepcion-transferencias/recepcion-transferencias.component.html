<div class="card">
    <div class="card-header pb-0 bg-lumiere">
        <div class="d-flex align-items-center">
            <h5 class="mb-1 text-white">Recepcion de transferencias</h5>
        </div>
    </div>
    <div class="card-body">
        <div class="container">
            <div class="row" *ngIf="seleccion !== undefined">
                <div class="col-sm-6">
                    <button class="btn btn-success" (click)="aceptar()">Aceptar</button>
                </div>
                <div class="col-sm-6">
                    <button class="btn btn-danger" (click)="rechazar()">Rechazar</button>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12">
                    <app-tabla [configuracion]="configuracion" [datos]="datos" (emitidor)="seleccion = $event;"></app-tabla>
                </div>
            </div>
        </div>
    </div>
</div>
