<div class="modal-header bg-info">
    <h4 class="text-white">Meta</h4>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
</div>
<div class="modal-body">
    <div class="container">
        <div class="row">
            <div class="col-sm-3">
                <app-input [valor]="dato.meta" [validacion]="'numero'" [etiqueta]="'Eventos'" (emitidor)="dato.meta = $event"></app-input>
            </div>
            <div class="col-sm-3">
                <app-select [datos]="lista.usuarios" [dato]="dato.idUsuario" [etiqueta]="'Usuario'" (emitidor)="dato.idUsuario = $event"></app-select>
            </div>
            <div class="col-sm-3">
                <app-select [datos]="lista.calendarios" [dato]="dato.idCalendario" [etiqueta]="'Calendario'" (emitidor)="dato.idCalendario = $event"></app-select>
            </div>
            <div class="col-sm-3">
                <app-select [datos]="meses" [dato]="dato.mes" [etiqueta]="'Mes'" (emitidor)="dato.mes = $event"></app-select>
            </div>
        </div>
        <div class="row justify-content-end">
            <div class="col-sm-12 d-md-flex justify-content-md-end">
                <button class="btn btn-success" (click)="emitir()">Guardar</button>
                <button class="btn btn-danger" (click)="cerrar()">Cancelar</button>
            </div>
        </div>
    </div>
</div>
